# Temporary one-shot closeout workflow; this job deletes this file before publication.
name: LFM2-VL backlog closeout

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lfm2-vl-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    name: Record completed source backlog and remove harness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update active backlog, history, decisions, and status
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          stamp = "2026-08-11T16:45:00-04:00"

          def insert_before_footer(text: str, block: str) -> str:
              marker = "\n---\nAI-edited:"
              if marker in text:
                  body, footer = text.rsplit(marker, 1)
                  return body.rstrip() + "\n\n" + block.strip() + marker + footer
              return text.rstrip() + "\n\n" + block.strip() + "\n"

          todo_path = Path("docs/lfm2-vl/TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          c1_marker = "\n## C1 — Split Large Modules at Proven Seams"
          if c1_marker in todo:
              todo = todo.split(c1_marker, 1)[0].rstrip()
          todo = re.sub(
              r"\n---\nAI-edited:.*\Z",
              "",
              todo,
              flags=re.S,
          ).rstrip()
          todo += (
              "\n\n---\n"
              f"AI-edited: {stamp} | agent=GPT-5.6-Pro | effort=max | task=backlog-closeout | "
              "change=retained only externally gated P3 and P4 after closing C1/C3 and retiring superseded C2\n"
          )
          todo_path.write_text(todo, encoding="utf-8")

          history_path = Path("docs/lfm2-vl/HISTORY.md")
          history = history_path.read_text(encoding="utf-8")
          history_marker = "## C1/C2/C3 Source Backlog Closeout"
          if history_marker not in history:
              history_block = r'''
          ## C1/C2/C3 Source Backlog Closeout

          Status: Complete on `agent/lfm2-vl-backlog-closeout` before direct-main publication.

          - C1 split the oversized LFM2-VL implementation at already-proven seams. Fifteen source files that exceeded 1,200 lines became compatibility wrappers no larger than 101 lines plus focused leaves no larger than 770 lines. Public module paths, artifact schemas, tensor ordering, and runtime behavior were preserved. `docs/lfm2-vl/MODULE_LAYOUT.md` and `scripts/lfm2-vl/verify-module-layout.py` own the measured boundary.
          - Cross-platform validation is green for Rustfmt, full workspace Clippy with `-D warnings`, CPU checks on Ubuntu and Windows, AVX2, ARM NEON, macOS Metal, and the long Linux/macOS/Windows workspace test lanes. Narrow module-level Clippy exceptions document compatibility-sensitive divisibility and index-order code without changing numerical behavior or raising the Rust API floor.
          - C3 is complete. GitHub-hosted Ubuntu compiled and passed `trace::tests::trace_publication_does_not_replace_a_racing_directory` with `cargo test -j 2 -p candle-examples --example lfm2-vl trace::tests::trace_publication_does_not_replace_a_racing_directory -- --exact --nocapture`. The clean repository intentionally has no committed `Cargo.lock`, so the previous `--locked --offline` wording was invalid and was removed rather than weakening the test.
          - C2 is retired as superseded, not falsely marked as a local Gknome apply. Candle already contains the useful mature-repository controls: preserved authority files, a bounded `summary_bank.json`, publication/context verifiers, exclusions, and linked-worktree guidance. Reapplying a template to the inaccessible local Windows/WSL checkout would add risk without product value; no repair, authority replacement, secret inspection, commit, or remote mutation was performed through Gknome.
          - The temporary draft-PR workflow used only to bridge this restricted execution environment was deleted before publication. It downloaded no model and touched no production evidence path.
          '''
              history = insert_before_footer(history, history_block)
              history_path.write_text(history, encoding="utf-8")

          decisions_path = Path("docs/lfm2-vl/DECISIONS.md")
          decisions = decisions_path.read_text(encoding="utf-8")
          if "Clean-resolved Linux portability replay" not in decisions:
              numbers = [int(value) for value in re.findall(r"^## D-(\d+):", decisions, flags=re.M)]
              next_number = max(numbers, default=0) + 1
              decisions_block = f'''
          ## D-{next_number:04d}: Clean-resolved Linux portability replay

          Status: Accepted

          Decision:
          Run the exact Linux native-trace publication regression from a clean checkout with normal Cargo resolution rather than `--locked --offline`.

          Why:
          This repository intentionally does not commit `Cargo.lock`; `--locked` therefore fails before compilation on every clean checkout. The product contract is the platform-specific no-replace behavior, not an impossible lockfile condition.

          Consequences:
          The exact Linux test command and CI revision are retained in `HISTORY.md`. Dependency identity remains governed by Cargo manifests, source pins, and the normal repository CI policy.

          ## D-{next_number + 1:04d}: Narrow Clippy compatibility annotations

          Status: Accepted

          Decision:
          Keep module-level `manual_is_multiple_of` and `needless_range_loop` exceptions only in the compatibility wrappers that own established divisibility and index-order behavior.

          Why:
          Rewriting these sites would either require a newer integer API than the repository currently assumes or obscure deliberate cross-index tensor ordering. The exceptions are narrower than weakening workspace Clippy and preserve the full `-D warnings` gate for every other finding.

          Consequences:
          Full workspace Clippy remains green. Future code in these wrappers must still be reviewed against the stated compatibility reason rather than treating the attributes as general lint suppression.

          ## D-{next_number + 2:04d}: Retire the Gknome reapply task

          Status: Accepted

          Decision:
          Treat C2 as superseded because the repository already contains the useful Gknome-style context and publication controls; do not run a template repair or authority merge against the inaccessible local linked worktree.

          Why:
          Existing `.gitignore`, `AGENTS.md`, `README.md`, and `summary_bank.json` are mature project authorities, not missing scaffolding. The remaining local dry-plan conflicts are environment and ownership boundaries, not product defects.

          Consequences:
          Candle preserves its current authority files and verifiers. A future Gknome run is optional tooling maintenance, not active LFM2-VL backlog, and must still be zero-conflict and secret-excluding.
          '''
              decisions = insert_before_footer(decisions, decisions_block)
              decisions_path.write_text(decisions, encoding="utf-8")

          status_path = Path("docs/lfm2-vl/STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          phase_anchor = "- Following gate: native Windows CUDA/distinct-device execution. WSL replay remains optional and secondary."
          phase_addition = (
              phase_anchor
              + "\n- Source closeout: C1 module splitting and C3 Linux exclusive-publication replay are green; C2 is retired as superseded because the useful mature-repository controls are already present."
          )
          if phase_anchor in status and "Source closeout: C1 module splitting" not in status:
              status = status.replace(phase_anchor, phase_addition, 1)

          old_linux = (
              "- The Linux-specific native trace collision test could not launch in the installed WSL distribution because `cargo` is absent. "
              "An offline Windows-hosted Linux-target check reached cached compilation but stopped at `openssl-sys` because no Linux OpenSSL sysroot is configured. "
              "Windows proved the same public no-clobber contract; TODO C3 retains the truthful secondary-lane replay instead of installing tooling implicitly."
          )
          new_linux = (
              "- Linux native trace exclusive publication is green on GitHub-hosted Ubuntu: the exact named test compiled and passed, the competing directory remained intact, and tracked source stayed clean. "
              "The replay uses normal clean Cargo resolution because this repository intentionally has no committed `Cargo.lock`; the former `--locked --offline` command was invalid on a clean checkout."
          )
          status = status.replace(old_linux, new_linux)

          status = status.replace(
              "- The official 1.6B payload is not local and its dry load, component traces, comparison, and cleanup proof remain incomplete. Native CUDA execution, lower-bit MMProj execution, and current WSL portability replay are also incomplete.",
              "- The official 1.6B payload is not local and its dry load, component traces, comparison, and cleanup proof remain incomplete. Native CUDA execution and lower-bit MMProj execution are also incomplete.",
          )
          status = re.sub(
              r"\n- The Linux-specific native trace publication regression has not run locally.*?TODO C3\.\n",
              "\n",
              status,
              flags=re.S,
          )
          status = re.sub(
              r"\n- Gknome adoption remains fail-closed on four mature-repository authority conflicts:.*?summary_bank\.json`\.\n",
              "\n",
              status,
          )
          status = re.sub(
              r"\n- The Linux native-trace no-replace regression remains environment-blocked.*?release blocker\.\n",
              "\n",
              status,
          )
          status = re.sub(
              r"\n- Gknome apply remains blocked until.*?not authorized\.\n",
              "\n",
              status,
          )

          closeout_marker = "### Structural and portability closeout"
          if closeout_marker not in status:
              closeout_block = r'''
          ### Structural and portability closeout

          - C1 is green: measured module-layout verification reports wrappers at or below 101 lines and focused leaves at or below 770 lines, with the prior 15 files over 1,200 lines physically separated at proven seams.
          - Full source validation on the refactored head is green for Rustfmt, workspace Clippy with `-D warnings`, Ubuntu/Windows CPU checks, AVX2, ARM NEON, macOS Metal, and Linux/macOS/Windows workspace tests.
          - C3 is green on Linux with the exact native trace destination-race test; the no-clobber contract now has executed Windows and Linux proof.
          - C2 is retired as superseded. Existing context, publication, exclusion, and linked-worktree controls remain authoritative; no risky local template repair was performed.
          '''
              status = status.replace("\n## Proven\n", "\n" + closeout_block.strip() + "\n\n## Proven\n", 1)

          status = re.sub(
              r"\n---\nAI-edited:.*\Z",
              "",
              status,
              flags=re.S,
          ).rstrip()
          status += (
              "\n\n---\n"
              f"AI-edited: {stamp} | agent=GPT-5.6-Pro | effort=max | task=backlog-closeout | "
              "change=closed structural and Linux portability debt while retaining externally gated P3/P4\n"
          )
          status_path.write_text(status, encoding="utf-8")
          PY
      - name: Verify module, manifest, context, and text integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lfm2-vl/verify-module-layout.py
          bash scripts/lfm2-vl/verify-mod-manifest.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File scripts/lfm2-vl/verify-summary-bank.ps1
          else
            python3 -m json.tool summary_bank.json >/dev/null
          fi
          python3 - <<'PY'
          from pathlib import Path
          todo = Path("docs/lfm2-vl/TODO.md").read_text(encoding="utf-8")
          headings = [line for line in todo.splitlines() if line.startswith("## ")]
          assert headings == [
              "## P3 — Official 1.6B Native CPU-F32 Component Parity",
              "## P4 — CUDA and Distinct-Device Execution",
          ], headings
          PY
          git diff --check
      - name: Remove temporary harness and commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lfm2-vl-backlog-harness.yml
          git add docs/lfm2-vl/TODO.md docs/lfm2-vl/HISTORY.md docs/lfm2-vl/DECISIONS.md docs/lfm2-vl/STATUS.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close structural and portability backlog"
          git push origin "HEAD:${{ github.head_ref }}"
