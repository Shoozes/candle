# Temporary connector-triggered validation; removed before publication.
name: LFM2-VL backlog harness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lfm2-vl-backlog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-source-fix:
    name: Apply validated source fix
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply source fix when staged
        shell: bash
        run: |
          set -euo pipefail
          script=.github/apply-source-fix.py
          if [[ ! -f "$script" ]]; then
            echo "No source fix is staged."
            exit 0
          fi

          python3 "$script"
          rm -f "$script"

          cargo fmt --all
          python3 scripts/lfm2-vl/verify-module-layout.py
          python3 -m json.tool summary_bank.json >/dev/null
          git diff --check

          git add -A
          git status --short
          GIT_AUTHOR_NAME='github-actions[bot]' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_NAME='github-actions[bot]' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit -m "fix(lfm2-vl): keep split attributes with their items"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
