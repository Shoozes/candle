# Temporary connector-triggered validation; removed before publication.
name: LFM2-VL backlog harness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lfm2-vl-backlog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-clippy-fixes:
    name: Apply exact Clippy compatibility annotations
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Add narrow module-level compatibility annotations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          updates = {
              "candle-transformers/src/models/lfm2.rs": "#![allow(clippy::manual_is_multiple_of)]",
              "candle-transformers/src/models/lfm2_vl/config.rs": "#![allow(clippy::manual_is_multiple_of)]",
              "candle-transformers/src/models/lfm2_vl/gguf.rs": "#![allow(clippy::manual_is_multiple_of)]",
              "candle-transformers/src/models/lfm2_vl/model.rs": "#![allow(clippy::needless_range_loop)]",
              "candle-transformers/src/models/siglip2.rs": "#![allow(clippy::manual_is_multiple_of, clippy::needless_range_loop)]",
          }

          for path_text, attribute in updates.items():
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if attribute in text:
                  continue
              lines = text.splitlines(keepends=True)
              if text.startswith("//!"):
                  index = 0
                  while index < len(lines) and (lines[index].startswith("//!") or not lines[index].strip()):
                      index += 1
                  lines[index:index] = [attribute + "\n", "\n"]
                  text = "".join(lines)
              else:
                  text = attribute + "\n\n" + text
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git add \
            candle-transformers/src/models/lfm2.rs \
            candle-transformers/src/models/lfm2_vl/config.rs \
            candle-transformers/src/models/lfm2_vl/gguf.rs \
            candle-transformers/src/models/lfm2_vl/model.rs \
            candle-transformers/src/models/siglip2.rs
          if git diff --cached --quiet; then
            echo "Compatibility annotations already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: document Clippy compatibility exceptions"
          git push origin "HEAD:${{ github.head_ref }}"

  export-workspace:
    name: Export exact tracked workspace
    runs-on: ubuntu-latest
    needs: apply-clippy-fixes
    if: always() && needs.apply-clippy-fixes.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Package tracked checkout
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/candle-workspace.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/candle-workspace.tar.gz" > "$RUNNER_TEMP/candle-workspace.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: candle-workspace-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/candle-workspace.tar.gz
            ${{ runner.temp }}/candle-workspace.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  linux-exclusive-publication:
    name: Linux native-trace exclusive publication
    runs-on: ubuntu-latest
    needs: apply-clippy-fixes
    if: always() && needs.apply-clippy-fixes.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lld pkg-config libssl-dev
      - name: Prove exact regression exists
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
        run: |
          set -euo pipefail
          cargo test -j 2 -p candle-examples --example lfm2-vl -- --list \
            | tee "$RUNNER_TEMP/lfm2-vl-tests.txt"
          grep -F "trace::tests::trace_publication_does_not_replace_a_racing_directory: test" \
            "$RUNNER_TEMP/lfm2-vl-tests.txt"
      - name: Run exact Linux no-replace regression
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
        run: |
          set -euo pipefail
          cargo test -j 2 -p candle-examples --example lfm2-vl \
            trace::tests::trace_publication_does_not_replace_a_racing_directory \
            -- --exact --nocapture
      - name: Check tracked source integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"

  clippy-diagnostics:
    name: Focused Clippy diagnostics
    runs-on: ubuntu-latest
    needs: apply-clippy-fixes
    if: always() && needs.apply-clippy-fixes.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --tests --examples --benches --message-format=short \
            -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/clippy.status"
          if [[ $status -ne 0 ]]; then
            tail -n 120 "$RUNNER_TEMP/clippy.log" || true
            exit "$status"
          fi
      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/clippy.log
            ${{ runner.temp }}/clippy.status
          if-no-files-found: error
          retention-days: 1

  windows-test-diagnostics:
    name: Windows test diagnostics
    runs-on: windows-latest
    needs: apply-clippy-fixes
    if: always() && needs.apply-clippy-fixes.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-tests.log'
          cmd /c "cargo test --workspace --no-fail-fast > `"$log`" 2>&1"
          $status = $LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-tests.status') -Value $status -NoNewline
          if ($status -ne 0) {
            Get-Content -LiteralPath $log -Tail 160
            exit $status
          }
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/windows-tests.log
            ${{ runner.temp }}/windows-tests.status
          if-no-files-found: error
          retention-days: 1
