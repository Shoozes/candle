name: LFM2-VL backlog harness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-refactor:
    name: Apply validated refactor payload
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply payload when present
        shell: bash
        env:
          EXPECTED_SHA256: 7398e553640d5c2db5a5d6643de81b4e3e6058c69e8031775b4308d520a6532a
        run: |
          set -euo pipefail
          payload=.github/lfm2-vl-backlog-payload.tar.gz.b64
          if [[ ! -f "$payload" ]]; then
            echo "No refactor payload is present."
            exit 0
          fi

          base64 --decode "$payload" > "$RUNNER_TEMP/lfm2-vl-refactor.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/lfm2-vl-refactor.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lfm2-vl-refactor.tar.gz"
          rm -f "$payload"

          python3 scripts/lfm2-vl/verify-module-layout.py
          python3 -m json.tool summary_bank.json >/dev/null
          cargo fmt --all -- --check
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(lfm2-vl): split oversized implementation units"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  export-workspace:
    name: Export exact tracked workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Package tracked checkout
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git archive --format=tar.gz --output="$RUNNER_TEMP/candle-workspace.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/candle-workspace.tar.gz" > "$RUNNER_TEMP/candle-workspace.tar.gz.sha256"
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: candle-workspace-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/candle-workspace.tar.gz
            ${{ runner.temp }}/candle-workspace.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  linux-exclusive-publication:
    name: Linux native-trace exclusive publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Resolve one isolated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Cargo.lock
          cargo generate-lockfile
          cargo fetch --locked
      - name: Prove exact regression exists
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --offline -j 2 -p candle-examples --example lfm2-vl -- --list \
            | tee "$RUNNER_TEMP/lfm2-vl-tests.txt"
          grep -F "trace::tests::trace_publication_does_not_replace_a_racing_directory: test" \
            "$RUNNER_TEMP/lfm2-vl-tests.txt"
      - name: Run Linux no-replace regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --offline -j 2 -p candle-examples --example lfm2-vl \
            trace::tests::trace_publication_does_not_replace_a_racing_directory \
            -- --exact --nocapture
      - name: Check tracked source integrity
        shell: bash
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          git diff --check
          test -z "$(git status --short)"
