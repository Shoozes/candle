on:
  push:
    branches:
      - main
  pull_request:

name: Continuous integration

env:
  # Incremental compilation would just be overhead, so we can disable it entirely.
  CARGO_INCREMENTAL: 0

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, windows-latest, macOS-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Remove cargo config (macOS ring crate fix)
        if: runner.os == 'macOS'
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.os }}
          # Save only from main
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run macos with metal
        if: matrix.os == 'macOS-latest'
        run: cargo check --locked --workspace --all-targets --features metal

      - name: Run normal cpu
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        run: cargo check --locked --workspace --all-targets

      - name: Run with avx2
        if: matrix.os == 'ubuntu-24.04'
        run: |
          export RUSTFLAGS="-C target-feature=avx2"
          cargo check --locked --workspace --all-targets

      - name: Run with arm neon
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          export RUSTFLAGS="-C target-feature=neon"
          cargo check --locked --workspace --all-targets

  test:
    permissions:
      contents: read
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Remove cargo config (macOS ring crate fix)
        if: runner.os == 'macOS'
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.os }}
          # Save only from main
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install lld (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Run tests (with lld on Linux)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          cargo test --locked --workspace --lib --bins --tests
          cargo test --locked --workspace --doc
      - name: Run tests (Windows & macOS)
        if: runner.os != 'Linux'
        run: |
          cargo test --locked --workspace --lib --bins --tests
          cargo test --locked --workspace --doc

  fmt:
    permissions:
      contents: read
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    permissions:
      contents: read
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --tests --examples --benches -- -D warnings
